```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brand Vision | Inicio</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- =================================
         BARRA DE NAVEGACIÓN
    ================================== -->

    <div id="barra"></div>


    <!-- =================================
         CONTENIDO PRINCIPAL
    ================================== -->

    <main>

        <section class="home">

    <p class="home-label">
        BRAND VISION
    </p>

    <h1>
        La publicidad
        <span>ahora se vive.</span>
    </h1>

    <p class="home-description">
        Transformamos la publicidad tradicional en
        experiencias digitales mediante realidad
        aumentada, tecnología 3D y soluciones
        interactivas.
    </p>

    <a href="servicios.html" class="home-button">
        Conocer nuestros servicios
        <span>↗</span>
    </a>

    <!-- LOGO GRANDE -->
    <div class="home-logo">
        <img src="imagenes/brand.png" alt="Logo Brand Vision">
    </div>

</section>

    </main>


    <!-- =================================
         FOOTER
    ================================== -->

    <div id="footer"></div>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>

        /* ==============================
           CARGAR BARRA
        ============================== */

        fetch("./barra.html")

            .then(response => {

                if (!response.ok) {
                    throw new Error("No se pudo cargar barra.html");
                }

                return response.text();

            })

            .then(data => {

                document.getElementById("barra").innerHTML = data;

            })

            .catch(error => {

                console.error(
                    "Error al cargar la barra:",
                    error
                );

            });


        /* ==============================
           CARGAR FOOTER
        ============================== */

        fetch("./footer.html")

            .then(response => {

                if (!response.ok) {
                    throw new Error("No se pudo cargar footer.html");
                }

                return response.text();

            })

            .then(data => {

                document.getElementById("footer").innerHTML = data;

            })

            .catch(error => {

                console.error(
                    "Error al cargar el footer:",
                    error
                );

            });

    </script>


</body>

</html>
```
